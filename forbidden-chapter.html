<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forbidden Chapter | The Legend of Anantam</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at center, #241638 0%, #0b0712 70%);
            color: #f3e7c5;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        .chapter {
            max-width: 750px;
            padding: 45px 30px;
            border: 1px solid #a88745;
            background: rgba(10, 7, 18, 0.85);
            box-shadow: 0 0 40px rgba(168, 135, 69, 0.18);
        }

        .rune {
            color: #d6b568;
            font-size: 56px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d6b568;
            font-size: clamp(30px, 6vw, 48px);
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .warning {
            color: #c46e78;
            letter-spacing: 4px;
            font-size: 12px;
            margin-bottom: 35px;
        }

        p {
            font-size: 19px;
            line-height: 1.9;
            margin: 20px 0;
        }

        .secret {
            margin-top: 35px;
            color: #d6b568;
            font-style: italic;
        }

        a {
            display: inline-block;
            margin-top: 35px;
            padding: 13px 25px;
            border: 1px solid #d6b568;
            color: #d6b568;
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        a:hover {
            background: #d6b568;
            color: #0b0712;
            box-shadow: 0 0 20px rgba(214, 181, 104, 0.35);
        }
    </style>
</head>

<body>
    <main class="chapter">
        <div class="rune">ᛟ</div>

        <div class="warning">RESTRICTED KNOWLEDGE</div>

        <h1>THE FORBIDDEN CHAPTER</h1>

        <p>
            You have crossed the boundary that was never meant to be crossed.
        </p>

        <p>
            The deepest secret is not what waits behind the Gate…
            but who has been keeping it closed.
        </p>

        <p class="secret">
            Every legend hides a truth.<br>
            Every truth has a price.
        </p>

        <a href="index.html">RETURN TO ANANTAM</a>
    </main>
</body>
</html>
